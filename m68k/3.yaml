name: "assert format_string('%-5d\n42\n') == ('42   ', '')"
limit: 2000
memory_size: 0x1000
memory_mapped_io:
  0x80: [37, 45, 53, 100, 10, 52, 50, 10]
  0x84: []
reports:
  - name: Check results
    slice: last
    filter:
      - state
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
      symio[0x80]: {io:0x80:sym}
      symio[0x84]: {io:0x84:sym}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [52,50,32,32,32]
      symio[0x80]: "" >>> ""
      symio[0x84]: "" >>> "42   "